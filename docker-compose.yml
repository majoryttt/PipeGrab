services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg_downloader_bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./downloads:/app/downloads
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    # Если вы используете локальный Telegram Bot API Server, раскомментируйте depends_on:
    # depends_on:
    #   - telegram-bot-api

  # Опциональный сервис: Локальный сервер Telegram Bot API
  # Позволяет отправлять видео размером до 2 ГБ (вместо стандартных 50 МБ).
  # Для активации получите API_ID и API_HASH на https://my.telegram.org,
  # укажите их ниже или в .env, и в .env установите:
  # LOCAL_BOT_API_URL=http://telegram-bot-api:8081
  # MAX_FILE_SIZE_MB=2000
  #
  # telegram-bot-api:
  #   image: aiogram/telegram-bot-api:latest
  #   container_name: tg_local_bot_api
  #   restart: unless-stopped
  #   environment:
  #     TELEGRAM_API_ID: "${TELEGRAM_API_ID:-}"
  #     TELEGRAM_API_HASH: "${TELEGRAM_API_HASH:-}"
  #     TELEGRAM_LOCAL: "true"
  #   volumes:
  #     - ./downloads:/var/lib/telegram-bot-api
  #   ports:
  #     - "8081:8081"
